# Builds the Windows installer and attaches it to a draft GitHub release.
# Installed apps offer the update once the draft is published: they look for
# the `-setup.exe` asset of the latest release (src/platform/updates.ts).
# Trigger: push a tag like v0.1.0, or run it by hand from the Actions tab.
name: Release (Windows installer)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: Build the NSIS installer and draft a release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # When started by hand there is no tag; fall back to the version in tauri.conf.json.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Game Backlog v__VERSION__"
          releaseBody: "Windows installer: download the `-setup.exe` file below."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Keep the installer as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: game-backlog-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
