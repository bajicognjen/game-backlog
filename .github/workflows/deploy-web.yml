# Publishes the web version: builds the UI and deploys the Worker in
# wrangler.jsonc (static assets plus the API proxy) to Cloudflare.
# Trigger: the same `v*` tags as the Windows installer, or by hand.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (an API token made
# from the "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy web app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - run: npm run build

      # The sync database's schema (worker/migrations), then the Worker itself.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply game-backlog-sync --remote

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
